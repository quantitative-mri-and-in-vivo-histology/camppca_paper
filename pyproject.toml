[project]
name = "camppca-paper"
version = "0.1.0"
description = "Analyses and figures for the CAMP-PCA manuscript"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Laurin Mordhorst", email = "laurin.mordhorst@gmx.de"},
]

# camppca is the submodule at submodules/camppca. Install it first.
dependencies = [
    "camppca",
    "numpy>=1.24.0",
    "scipy>=1.15",
    "nibabel>=5.0.0",
    "matplotlib>=3.7.0",
    "dipy>=1.12",
    "awscli",
    "threadpoolctl",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "ruff>=0.1.0",
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["camppca_paper"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = ["submodules"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["camppca_paper"]
